# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python
name: RECUR

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "dev-*"
      - "feat/**"
    paths-ignore:
      - '.gitignore'
      - 'README.md'
      - 'LICENSE'
      - 'DEVNOTES.md'
      - 'CONTRIBUTING.md'
      - 'CONDUCT.md'

  pull_request:
    branches:
      - "main"
      - "dev-*"
      - "feat/**"
    types:
      - opened
      - synchronize
      - reopened
    paths-ignore:
      - '.gitignore'
      - 'README.md'
      - 'LICENSE'
      - 'DEVNOTES.md'
      - 'CONTRIBUTING.md'
      - 'CONDUCT.md'

jobs:
  build:
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        operating-system: [ubuntu-latest]
    runs-on: ${{ matrix.operating-system }}

    steps:
      - name: Get Code
        uses: actions/checkout@v4

      - name: Load & Cache Dependencies
        id: cache-dependencies
        uses: ./.github/actions/cached-dependencies
        with:
          python-version: ${{ matrix.python-version }}
          caching: "true"

      - name: Output information
        run: |
          echo "Pip cache used? ${{ steps.cache-dependencies.outputs.used-cache }}"
          echo "IQ-TREE2 cache hit? ${{ steps.cache-dependencies.outputs.iqtree2-cache-hit }}"
          which python
          python --version
          which iqtree2 || true

      - name: Test screen printout
        run: python recur.py

  test:
    needs: build
    continue-on-error: true
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        operating-system: [ubuntu-latest]
    runs-on: ${{ matrix.operating-system }}

    steps:
      - name: Get Code
        uses: actions/checkout@v4

      - name: Load & Cache Dependencies
        id: cache-dependencies
        uses: ./.github/actions/cached-dependencies
        with:
          python-version: ${{ matrix.python-version }}
          caching: "true"

      - name: Verify IQ-TREE2
        run: |
          which iqtree2
          iqtree2 --version

      # - name: Test with mypy
      #   id: run-mypy
      #   run: mypy src/

      - name: Run on ExampleData
        # if: steps.run-mypy.outcome == 'success'
        run: python3 recur.py -f ExampleData -st AA --outgroups ExampleData

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ExampleData-Output-${{ matrix.python-version }}
          path: ExampleData/

      - name: Test with pytest
        run: |
          pytest -sv tests/

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update badge status to passing
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && success() }}
        run: |
          echo '{"schemaVersion": 1, "label": "Tested", "message": "passing", "color": "brightgreen"}' > badge-status.json
          if ! git diff --quiet; then
            git add badge-status.json
            git commit -m "Update badge status to passing"
            git push origin main
          else
            echo "No changes to commit"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: Update badge status to failing
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && failure() }}
        run: |
          echo '{"schemaVersion": 1, "label": "Tested", "message": "failing", "color": "red"}' > badge-status.json
          if ! git diff --quiet; then
            git add badge-status.json
            git commit -m "Update badge status to failing"
            git push origin main
          else
            echo "No changes to commit"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

