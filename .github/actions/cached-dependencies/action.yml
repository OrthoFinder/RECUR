name: "Get and Cache dependencies"
description: "Get the dependencies and cache them"

inputs:
  python-version:
    description: "Python version to set up"
    required: true
  caching:
    description: "Whether to cache dependencies or not"
    required: false
    default: "true"

outputs:
  used-cache:
    description: "Whether the pip cache was used"
    value: ${{ steps.setup-python.outputs.cache-hit }}
  iqtree3-cache-hit:
    description: "Whether the iqtree3 cache was used"
    value: ${{ steps.iqtree3-cache.outputs.cache-hit }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      id: setup-python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: ${{ inputs.caching == 'true' && 'pip' || '' }}
        cache-dependency-path: |
          requirements.txt

    - name: Install Python dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install mypy pytest pytest-cov
        if [ -f requirements.txt ]; then
          python -m pip install -r requirements.txt
        fi

    - name: Restore iqtree3 cache
      id: iqtree3-cache
      if: inputs.caching == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/recur-bin
        key: ${{ runner.os }}-iqtree3-v1

    - name: Install iqtree3 using Makefile
      if: inputs.caching != 'true' || steps.iqtree3-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        BIN_DIR="${{ runner.temp }}/recur-bin"
        mkdir -p "$BIN_DIR"

        make install_iqtree3 \
          SYSTEM_WIDE=false \
          USER_INSTALL_DIR="$BIN_DIR" \
          FORCE=false \
          QUIET=true

        "$BIN_DIR/iqtree3" --version

    - name: Add iqtree3 to PATH
      shell: bash
      run: |
        echo "${{ runner.temp }}/recur-bin" >> "$GITHUB_PATH"
